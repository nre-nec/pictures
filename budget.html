<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير مدير المركز 2026 - كلية الشمال للتمريض</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Dependencies for Recharts -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/classnames/2.3.2/index.min.js"></script>
    
    <!-- Recharts (Stable Version) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.5.0/Recharts.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        // Wait for window load to ensure all scripts are parsed
        window.onload = () => {
            const { useState, useEffect } = React;
            
            // Check if Recharts loaded correctly
            if (!window.Recharts) {
                document.getElementById('root').innerHTML = '<div class="p-4 text-red-600 font-bold">عذراً، حدث خطأ في تحميل مكتبة الرسومات البيانية. يرجى التحقق من الاتصال بالإنترنت وتحديث الصفحة.</div>';
                throw new Error("Recharts library not loaded");
            }

            const { 
                PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, Legend, ResponsiveContainer 
            } = window.Recharts;
            
            const { motion } = window.Motion;

            // --- Icon Components (SVG Replacements for Lucide) ---
            const IconWrapper = ({ children, className }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {children}
                </svg>
            );

            const Wallet = (props) => <IconWrapper {...props}><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h4v-8Z"/></IconWrapper>;
            const TrendingUp = (props) => <IconWrapper {...props}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconWrapper>;
            const Users = (props) => <IconWrapper {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>;
            const FileText = (props) => <IconWrapper {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></IconWrapper>;
            const CheckCircle = (props) => <IconWrapper {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconWrapper>;
            const AlertCircle = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconWrapper>;
            const Printer = (props) => <IconWrapper {...props}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></IconWrapper>;
            const ArrowDownRight = (props) => <IconWrapper {...props}><path d="m7 7 10 10"/><path d="M17 7v10H7"/></IconWrapper>;
            const Building2 = (props) => <IconWrapper {...props}><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></IconWrapper>;
            const Calculator = (props) => <IconWrapper {...props}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></IconWrapper>;

            // --- Data Constants ---
            const KPI_DATA = [
                { title: "صافي الإيرادات", value: "1,156,522", suffix: "ر.س", icon: Wallet, color: "text-emerald-600", bg: "bg-emerald-100", trend: "+stable" },
                { title: "إجمالي المصروفات", value: "386,600", suffix: "ر.س", icon: ArrowDownRight, color: "text-rose-600", bg: "bg-rose-100", trend: "-controlled" },
                { title: "صافي الربح المتوقع", value: "769,922", suffix: "ر.س", icon: TrendingUp, color: "text-blue-600", bg: "bg-blue-100", trend: "+high" },
                { title: "هامش الربح", value: "66.5", suffix: "%", icon: Calculator, color: "text-violet-600", bg: "bg-violet-100", trend: "+excellent" },
            ];

            const EXPENSES_DATA = [
                { name: 'مكافآت المدربين', value: 157500, fill: '#3b82f6' },
                { name: 'رسوم طلاب', value: 140000, fill: '#10b981' },
                { name: 'تدريب مدربين', value: 30000, fill: '#f59e0b' },
                { name: 'تجديد جمعية القلب', value: 20000, fill: '#ef4444' },
                { name: 'مستهلكات وصيانة', value: 19500, fill: '#8b5cf6' },
                { name: 'أخرى', value: 19600, fill: '#64748b' },
            ];

            const REVENUE_DATA = [
                { name: 'ACLS 2025', students: 700, revenue: 455000, fill: '#3b82f6' },
                { name: 'ACLS 2026', students: 700, revenue: 455000, fill: '#6366f1' },
                { name: 'BLS 2026', students: 700, revenue: 210000, fill: '#10b981' },
                { name: 'HFSA 2026', students: 700, revenue: 210000, fill: '#14b8a6' },
            ];

            const EXPENSE_TABLE_DATA = [
                { id: 1, item: "مكافآت تشجيعية للمدربين", amount: 157500, law: "المادة (5/1): استحقاقات المشاركين" },
                { id: 2, item: "رسوم واشتراكات (رسوم طلاب)", amount: 140000, law: "المادة (5/10): مصروفات البرامج" },
                { id: 3, item: "دورات تدريبية للمدربين", amount: 30000, law: "المادة (5/1): تطوير الكوادر" },
                { id: 4, item: "تجديد جمعية القلب للمركز", amount: 20000, law: "المادة (5/6): عقود المؤسسات" },
                { id: 5, item: "مستهلكات تدريب طلاب", amount: 10000, law: "المادة (5/10): مستلزمات التدريب" },
                { id: 6, item: "زكاة الفترة", amount: 6000, law: "إجراء محاسبي" },
                { id: 7, item: "ضيافة + كهرباء ومياه", amount: 10000, law: "المادة (5/8) والمادة (5/4)" },
                { id: 8, item: "صيانة عامة", amount: 4500, law: "المادة (5/4): صيانة المرافق" },
                { id: 9, item: "تذاكر سفر", amount: 3000, law: "المادة (5/9): وسائل النقل" },
                { id: 10, item: "قرطاسية + اشتراكات إلكترونية", amount: 5000, law: "المادة (26/1) والمادة (5/10)" },
                { id: 11, item: "إهلاك أصول + رسوم بنكية", amount: 600, law: "مصروفات إدارية" },
            ];

            // --- Variants ---
            const containerVariants = {
                hidden: { opacity: 0 },
                visible: { opacity: 1, transition: { staggerChildren: 0.1 } }
            };

            const itemVariants = {
                hidden: { y: 20, opacity: 0 },
                visible: { y: 0, opacity: 1, transition: { type: "spring", stiffness: 100 } }
            };

            // --- Components ---

            const StatCard = ({ item }) => (
                <motion.div 
                    variants={itemVariants}
                    className="bg-white rounded-xl p-6 shadow-sm border border-slate-100 hover:shadow-md transition-shadow duration-300"
                >
                    <div className="flex justify-between items-start mb-4">
                        <div className={`p-3 rounded-lg ${item.bg}`}>
                            <item.icon className={`w-6 h-6 ${item.color}`} />
                        </div>
                        {item.trend === "+stable" && <span className="text-xs font-medium px-2 py-1 bg-green-100 text-green-700 rounded-full">مستقر</span>}
                        {item.trend === "+high" && <span className="text-xs font-medium px-2 py-1 bg-blue-100 text-blue-700 rounded-full">مرتفع</span>}
                        {item.trend === "+excellent" && <span className="text-xs font-medium px-2 py-1 bg-violet-100 text-violet-700 rounded-full">ممتاز</span>}
                    </div>
                    <h3 className="text-slate-500 text-sm font-medium mb-1">{item.title}</h3>
                    <div className="flex items-baseline gap-1">
                        <span className="text-2xl font-bold text-slate-800">{item.value}</span>
                        <span className="text-sm text-slate-400 font-medium">{item.suffix}</span>
                    </div>
                </motion.div>
            );

            const SectionHeader = ({ title, icon: Icon }) => (
                <div className="flex items-center gap-2 mb-6 border-b border-slate-200 pb-2">
                    <Icon className="w-5 h-5 text-blue-600" />
                    <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                </div>
            );

            function App() {
                const handlePrint = () => {
                    window.print();
                };

                return (
                    <div className="min-h-screen bg-slate-50 text-right" dir="rtl">
                        {/* Header */}
                        <header className="bg-white border-b border-slate-200 sticky top-0 z-50 no-print">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                                <div className="flex justify-between items-center h-20">
                                    <div className="flex items-center gap-3">
                                        <img 
                                            src="https://nre-nec.github.io/pictures/logo.png" 
                                            alt="شعار كلية الشمال" 
                                            className="h-16 w-auto object-contain"
                                        />
                                        <div>
                                            <h1 className="text-xl font-bold text-slate-800">كلية الشمال للتمريض الأهلية</h1>
                                            <p className="text-xs text-slate-500">مركز الاستشارات وخدمة المجتمع</p>
                                        </div>
                                    </div>
                                    <div className="hidden md:flex items-center gap-4">
                                        <span className="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full">السنة المالية 2026</span>
                                        <button 
                                            onClick={handlePrint}
                                            className="flex items-center gap-2 bg-slate-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-slate-700 transition-colors"
                                        >
                                            <Printer className="w-4 h-4" />
                                            طباعة التقرير
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* Print Header (Only visible when printing) */}
                        <div className="hidden print:block text-center mb-8 pt-4">
                            <img src="https://nre-nec.github.io/pictures/logo.png" className="h-20 mx-auto mb-2" />
                            <h1 className="text-2xl font-bold text-slate-800">التقرير المالي 2026</h1>
                        </div>

                        {/* Main Content */}
                        <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                            
                            {/* KPI Grid */}
                            <motion.div 
                                variants={containerVariants}
                                initial="hidden"
                                animate="visible"
                                className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10"
                            >
                                {KPI_DATA.map((item, index) => (
                                    <StatCard key={index} item={item} />
                                ))}
                            </motion.div>

                            {/* Layout Grid */}
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                
                                {/* Left Column (Charts & Analysis) */}
                                <div className="lg:col-span-2 space-y-8">
                                    
                                    {/* Revenue Analysis Chart */}
                                    <motion.div 
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        transition={{ delay: 0.2 }}
                                        className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 break-inside-avoid"
                                    >
                                        <SectionHeader title="تحليل الإيرادات المتوقعة (توزيع الدورات)" icon={TrendingUp} />
                                        <div className="h-[300px] w-full" dir="ltr">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <BarChart data={REVENUE_DATA} margin={{ top: 20, right: 30, left: 20, bottom: 5 }}>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                                    <XAxis dataKey="name" tick={{fill: '#64748b'}} axisLine={false} tickLine={false} />
                                                    <YAxis tickFormatter={(value) => `${value / 1000}k`} tick={{fill: '#64748b'}} axisLine={false} tickLine={false} />
                                                    <RechartsTooltip 
                                                        cursor={{fill: '#f1f5f9'}}
                                                        contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)', textAlign: 'right' }}
                                                    />
                                                    <Legend />
                                                    <Bar dataKey="revenue" name="الإيراد (ريال)" radius={[8, 8, 0, 0]} barSize={50} />
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                        <div className="mt-4 p-4 bg-emerald-50 rounded-xl border border-emerald-100">
                                            <p className="text-sm text-emerald-800 leading-relaxed">
                                                <span className="font-bold">رؤية تحليلية:</span> تمثل دورات (ACLS) العمود الفقري للإيرادات بنسبة مساهمة تبلغ 68%، مما يعكس القيمة السوقية العالية لهذه الدورة. جميع الدورات تعتبر قصيرة المدة، مما يضمن استقرار التدفقات النقدية وفق المادة (19).
                                            </p>
                                        </div>
                                    </motion.div>

                                    {/* Expenses Table */}
                                    <motion.div 
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        transition={{ delay: 0.3 }}
                                        className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 overflow-hidden break-inside-avoid"
                                    >
                                        <SectionHeader title="تفاصيل الموازنة والمصروفات" icon={FileText} />
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-right">
                                                <thead className="bg-slate-50 text-slate-500 font-medium">
                                                    <tr>
                                                        <th className="px-4 py-3 rounded-r-lg">البند</th>
                                                        <th className="px-4 py-3">المبلغ (ريال)</th>
                                                        <th className="px-4 py-3 rounded-l-lg">السند النظامي (التبرير)</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {EXPENSE_TABLE_DATA.map((row) => (
                                                        <tr key={row.id} className="hover:bg-slate-50 transition-colors group">
                                                            <td className="px-4 py-3 font-medium text-slate-800">{row.item}</td>
                                                            <td className="px-4 py-3 text-slate-600 font-mono">{row.amount.toLocaleString()}</td>
                                                            <td className="px-4 py-3 text-slate-500 text-xs group-hover:text-blue-600 transition-colors">{row.law}</td>
                                                        </tr>
                                                    ))}
                                                    <tr className="bg-blue-50/50 border-t-2 border-blue-100">
                                                        <td className="px-4 py-3 font-bold text-blue-900">الإجمالي الكلي</td>
                                                        <td className="px-4 py-3 font-bold text-blue-900 font-mono">386,600</td>
                                                        <td className="px-4 py-3"></td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </motion.div>

                                    {/* Trainers Bonus Analysis */}
                                    <motion.div 
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        transition={{ delay: 0.4 }}
                                        className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 break-inside-avoid"
                                    >
                                        <SectionHeader title="تحليل بند مكافآت المدربين (157,500 ريال)" icon={Users} />
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                <h4 className="font-bold text-slate-700 mb-2">دورات BLS & HFSA</h4>
                                                <div className="flex justify-between items-center text-sm mb-2">
                                                    <span className="text-slate-500">تكلفة الجلسة:</span>
                                                    <span className="font-mono font-bold text-emerald-600">300 ريال</span>
                                                </div>
                                                <div className="flex items-center gap-2 text-xs text-emerald-700 bg-emerald-100/50 p-2 rounded">
                                                    <CheckCircle className="w-4 h-4" />
                                                    مطابق للمادة (23) من اللائحة
                                                </div>
                                            </div>

                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                <h4 className="font-bold text-slate-700 mb-2">دورات ACLS المتقدمة</h4>
                                                <div className="flex justify-between items-center text-sm mb-2">
                                                    <span className="text-slate-500">تكلفة الجلسة:</span>
                                                    <span className="font-mono font-bold text-blue-600">600 ريال</span>
                                                </div>
                                                <div className="flex items-start gap-2 text-xs text-blue-700 bg-blue-100/50 p-2 rounded">
                                                    <AlertCircle className="w-4 h-4 mt-0.5 shrink-0" />
                                                    <span>يتطلب وجود مدربين اثنين أو تطبيق المادة (21) للندرة</span>
                                                </div>
                                            </div>
                                        </div>
                                    </motion.div>

                                </div>

                                {/* Right Column (Visual Distribution & Summary) */}
                                <div className="lg:col-span-1 space-y-8">
                                    
                                    {/* Expense Distribution Chart */}
                                    <motion.div 
                                        initial={{ opacity: 0, x: -20 }}
                                        animate={{ opacity: 1, x: 0 }}
                                        transition={{ delay: 0.3 }}
                                        className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 break-inside-avoid"
                                    >
                                        <h3 className="text-lg font-bold text-slate-800 mb-4">توزيع المصروفات</h3>
                                        <div className="h-[300px] w-full relative" dir="ltr">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <PieChart>
                                                    <Pie
                                                        data={EXPENSES_DATA}
                                                        cx="50%"
                                                        cy="50%"
                                                        innerRadius={60}
                                                        outerRadius={80}
                                                        paddingAngle={5}
                                                        dataKey="value"
                                                    >
                                                        {EXPENSES_DATA.map((entry, index) => (
                                                            <Cell key={`cell-${index}`} fill={entry.fill} />
                                                        ))}
                                                    </Pie>
                                                    <RechartsTooltip />
                                                </PieChart>
                                            </ResponsiveContainer>
                                            {/* Center Text */}
                                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center">
                                                <span className="text-xs text-slate-400">الإجمالي</span>
                                                <p className="text-lg font-bold text-slate-800">386K</p>
                                            </div>
                                        </div>
                                        <div className="space-y-3 mt-4">
                                            {EXPENSES_DATA.map((item, index) => (
                                                <div key={index} className="flex items-center justify-between text-sm">
                                                    <div className="flex items-center gap-2">
                                                        <div className="w-3 h-3 rounded-full" style={{ backgroundColor: item.fill }}></div>
                                                        <span className="text-slate-600">{item.name}</span>
                                                    </div>
                                                    <span className="font-mono text-slate-500">{((item.value / 386600) * 100).toFixed(1)}%</span>
                                                </div>
                                            ))}
                                        </div>
                                    </motion.div>

                                    {/* Recommendations & Summary */}
                                    <motion.div 
                                        initial={{ opacity: 0, x: -20 }}
                                        animate={{ opacity: 1, x: 0 }}
                                        transition={{ delay: 0.5 }}
                                        className="bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl p-6 text-white shadow-lg break-inside-avoid"
                                    >
                                        <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                                            <CheckCircle className="w-5 h-5 text-emerald-400" />
                                            الخلاصة والتوصيات
                                        </h3>
                                        <ul className="space-y-4 text-sm text-slate-300">
                                            <li className="flex gap-3 items-start">
                                                <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full mt-2 shrink-0"></span>
                                                <p>تم اعتماد موازنة تشغيلية بقيمة <span className="text-white font-bold">386,600 ريال</span>.</p>
                                            </li>
                                            <li className="flex gap-3 items-start">
                                                <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full mt-2 shrink-0"></span>
                                                <p>تحقيق صافي ربح مستهدف بقيمة <span className="text-white font-bold">769,922 ريال</span> وبهامش ربح 66.5%.</p>
                                            </li>
                                            <li className="flex gap-3 items-start">
                                                <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full mt-2 shrink-0"></span>
